# SonarCloud automatic analysis settings.

# crates/vendor holds upstream third-party crates (candle with its bundled
# CUTLASS Doxygen docs, Symphonia, limitation, newrelic-telemetry-sdk-rust).
# Findings there belong to their upstream projects, not to this repository.
# _docs/old is an archived, unused local-dev setup kept only for reference.
sonar.exclusions=crates/vendor/**,_docs/old/**

# typescript:S2245 (pseudorandom generator): every Math.random() in the
# frontend makes ephemeral client-side ids, upload titles, suggested
# usernames or cosmetic jitter. None is a secret, token or security decision.
sonar.issue.ignore.multicriteria=prng,devstripe,workerorigin,dumpsql,dumpcmd,dumppath,npminstall,npminstall2
sonar.issue.ignore.multicriteria.prng.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.prng.resourceKey=frontend/**/*

# secrets:S6718: Stripe test-mode webhook secret in the development env file,
# which states "All secrets are development and okay to check in".
sonar.issue.ignore.multicriteria.devstripe.ruleKey=secrets:S6718
sonar.issue.ignore.multicriteria.devstripe.resourceKey=crates/service/web/storyteller_web/config/storyteller-web.development.env

# typescript:S2819: a dedicated worker only receives messages from the page
# that created it; MessageEvent.origin is always empty there.
sonar.issue.ignore.multicriteria.workerorigin.ruleKey=typescript:S2819
sonar.issue.ignore.multicriteria.workerorigin.resourceKey=frontend/**/*.worker.ts

# pythonsecurity taint rules on an operator-run CLI: --table is checked
# against ALLOWED_TABLES before use and --directory is the operator's own
# choice of output folder.
sonar.issue.ignore.multicriteria.dumpsql.ruleKey=pythonsecurity:S8702
sonar.issue.ignore.multicriteria.dumpsql.resourceKey=script/database/mysql_dump_table.py
sonar.issue.ignore.multicriteria.dumpcmd.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.dumpcmd.resourceKey=script/database/mysql_dump_table.py
sonar.issue.ignore.multicriteria.dumppath.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.dumppath.resourceKey=script/database/mysql_dump_table.py

# shell:S6505 on `npm install` in local dev helpers: the lockfile's nx,
# esbuild and @swc/core need their install scripts, so --ignore-scripts
# would break the dev setup. The npx calls are fixed in code instead.
sonar.issue.ignore.multicriteria.npminstall.ruleKey=shell:S6505
sonar.issue.ignore.multicriteria.npminstall.resourceKey=script/**/*.sh
sonar.issue.ignore.multicriteria.npminstall2.ruleKey=shell:S6505
sonar.issue.ignore.multicriteria.npminstall2.resourceKey=frontend/build_modules.sh
